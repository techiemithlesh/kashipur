name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Lint deploy config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (local + production)
        run: |
          docker compose --env-file .env.docker.example config -q
          SWM_ENV_FILE=.env.production.example docker compose --env-file .env.production.example config -q
      - name: ShellCheck
        run: shellcheck -x deploy/scripts/*.sh deploy/nginx/*.sh SWM/Backend/docker/entrypoint.sh
      - name: Nginx configuration
        run: sh deploy/scripts/validate-nginx.sh

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - service: backend
            context: SWM/Backend
            dockerfile: Dockerfile
          - service: frontend
            context: SWM/FrontEnd
            dockerfile: Dockerfile
          - service: nginx
            context: deploy/nginx
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          build-args: |
            VITE_REACT_APP_BACKEND_API=https://ci.example.com
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
