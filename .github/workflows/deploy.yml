name: Deploy

# Manual, approval-gated deploys. Configure in GitHub -> Settings -> Environments -> "production":
#   required reviewers (optional), and these secrets:
#   VPS_HOST          server IP or hostname
#   VPS_USER          deploy
#   VPS_SSH_KEY       private key of a key pair whose public half is in ~deploy/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS   output of: ssh-keyscan -t ed25519 <VPS_HOST>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag or SHA). Use an older SHA to roll back.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ steps.rev.outputs.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" "cd /opt/swm && sh ./deploy/scripts/deploy.sh '$SHA'"
