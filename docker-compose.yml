name: swm

# Rotate container logs so they can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-SWM}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in the env file}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?Set APP_URL in the env file}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${APP_URL}}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in the env file}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in the env file}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in the env file}
  # Laravel publishes events to Reverb over the internal network.
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  QUEUE_FAILED_DRIVER: ${QUEUE_FAILED_DRIVER:-database-uuids}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-db_swm_master}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the env file}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
  DB_CONSUMER_HOST: db
  DB_CONSUMER_PORT: "5432"
  DB_CONSUMER_DATABASE: ${DB_CONSUMER_DATABASE:-db_swm_consumer}
  DB_CONSUMER_USERNAME: ${DB_CONSUMER_USERNAME:?Set DB_CONSUMER_USERNAME in the env file}
  DB_CONSUMER_PASSWORD: ${DB_CONSUMER_PASSWORD:?Set DB_CONSUMER_PASSWORD in the env file}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-backend-volumes: &backend-volumes
  - type: volume
    source: laravel_framework
    target: /var/www/html/storage/framework
  - type: volume
    source: laravel_logs
    target: /var/www/html/storage/logs
  - type: volume
    source: public_uploads
    target: /var/www/html/storage/app/public
  - type: volume
    source: private_uploads
    target: /var/www/html/storage/app/private

services:
  frontend:
    image: swm-frontend:${IMAGE_TAG:-local}
    build:
      context: ./SWM/FrontEnd
      args:
        VITE_REACT_APP_BACKEND_API: ${VITE_REACT_APP_BACKEND_API:?Set the public Nginx origin without /api or a trailing slash}
        VITE_REACT_APP_ULB_ID: ${VITE_REACT_APP_ULB_ID:-}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
        VITE_MAP_STREET_LABELS_URL: ${VITE_MAP_STREET_LABELS_URL:-}
        VITE_MAP_PLACE_LABELS_URL: ${VITE_MAP_PLACE_LABELS_URL:-}
        VITE_ROUTING_URL: ${VITE_ROUTING_URL:-}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - type: volume
        source: public_uploads
        target: /srv/swm/storage/app/public
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    image: swm-backend:${IMAGE_TAG:-local}
    build:
      context: ./SWM/Backend
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); if ($$socket) { fclose($$socket); exit(0); } exit(1);'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue:
    user: www-data
    image: swm-backend:${IMAGE_TAG:-local}
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=telemetry,default
      - --sleep=3
      - --tries=3
      - --timeout=90
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    restart: unless-stopped
    logging: *default-logging

  reverb:
    user: www-data
    image: swm-backend:${IMAGE_TAG:-local}
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r '$$socket = @fsockopen(\"127.0.0.1\", 8080); if ($$socket) { fclose($$socket); exit(0); } exit(1);'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the env file}
      POSTGRES_DB: postgres
      DB_DATABASE: ${DB_DATABASE:-db_swm_master}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
      DB_CONSUMER_DATABASE: ${DB_CONSUMER_DATABASE:-db_swm_consumer}
      DB_CONSUMER_USERNAME: ${DB_CONSUMER_USERNAME:?Set DB_CONSUMER_USERNAME in the env file}
      DB_CONSUMER_PASSWORD: ${DB_CONSUMER_PASSWORD:?Set DB_CONSUMER_PASSWORD in the env file}
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - type: volume
        source: redis_data
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data
    restart: unless-stopped
    logging: *default-logging

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  laravel_framework:
  laravel_logs:
  public_uploads:
  private_uploads:
