server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $laravel_fpm backend:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel Reverb browser WebSockets (/app/{key}). The /apps publish API stays internal.
    location ^~ /app/ {
        set $reverb reverb:8080;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api(?:/|$) {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        internal;
        root /var/www/html/public;
        include fastcgi.conf;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $laravel_fpm;
    }

    location ^~ /storage/ {
        alias /srv/swm/storage/app/public/;
        expires -1;
    }

    location ^~ /user/img/ {
        alias /srv/swm/storage/app/public/user/img/;
        expires -1;
    }

    location ^~ /driver/img/ {
        alias /srv/swm/storage/app/public/driver/img/;
        expires -1;
    }

    location ^~ /Uploads/UlbOfficers/ {
        alias /srv/swm/storage/app/public/Uploads/UlbOfficers/;
        expires -1;
    }

    location ^~ /documents/Uploads/UlbNotice/ {
        alias /srv/swm/storage/app/public/Uploads/UlbNotice/;
        expires -1;
    }

    location ^~ /UlbLog/ {
        alias /srv/swm/storage/app/public/UlbLog/;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
