# In production this server is only reachable through the Caddy TLS proxy (no published port),
# so X-Forwarded-Proto can be trusted. Locally the header is absent and requests stay plain HTTP.
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Restore the visitor's IP from the proxy in front (Docker private ranges only).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $laravel_fpm backend:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel Reverb browser WebSockets (/app/{key}). The /apps publish API stays internal.
    location ^~ /app/ {
        set $reverb reverb:8080;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api(?:/|$) {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        internal;
        root /var/www/html/public;
        include fastcgi.conf;
        fastcgi_param HTTP_PROXY "";
        # Lets Laravel's url() build https:// links behind the TLS proxy.
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        # The IP helper trusts these headers; never let clients spoof them.
        fastcgi_param HTTP_CLIENT_IP "";
        fastcgi_param HTTP_CF_CONNECTING_IP "";
        fastcgi_pass $laravel_fpm;
    }

    location ^~ /storage/ {
        alias /srv/swm/storage/app/public/;
        expires -1;
    }

    location ^~ /user/img/ {
        alias /srv/swm/storage/app/public/user/img/;
        expires -1;
    }

    location ^~ /driver/img/ {
        alias /srv/swm/storage/app/public/driver/img/;
        expires -1;
    }

    location ^~ /Uploads/UlbOfficers/ {
        alias /srv/swm/storage/app/public/Uploads/UlbOfficers/;
        expires -1;
    }

    location ^~ /documents/Uploads/UlbNotice/ {
        alias /srv/swm/storage/app/public/Uploads/UlbNotice/;
        expires -1;
    }

    location ^~ /UlbLog/ {
        alias /srv/swm/storage/app/public/UlbLog/;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
